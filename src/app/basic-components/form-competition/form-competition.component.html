<form [formGroup]="parentFormGroup">
  <div class="form-group competition-section">
    <h4>Konkurrencer</h4>
    <div class="form-competition-grid">
      <div formArrayName="competitions">
        <div
          *ngFor="let competition of control.controls; let i = index"
          [formGroupName]="i"
          class="form-competition-row"
        >
          <app-form-input-select
            class="competition-input"
            label="Gren"
            [control]="getCompetitionTypeControl(i)"
            [options]="competitionTypeOptions"
          >
          </app-form-input-select>
          <app-form-input-select
            class="competition-input"
            label="Klasse"
            [control]="getLevelControl(i)"
            [options]="levelOptions"
          >
          </app-form-input-select>
          <app-form-input-text
            class="competition-input"
            label="Pris"
            [control]="getPriceControl(i)"
          >
          </app-form-input-text>
          <div>
            <button mat-icon-button color="warn" (click)="deleteCompetition(i)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="competition-button-container">
    <button class="new-button" (click)="addCompetition()">
      Tilføj Konkurrence
    </button>
  </div>
</form>
